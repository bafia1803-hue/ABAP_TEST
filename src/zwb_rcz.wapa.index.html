<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wyniki rozliczenia czasu pracy</title>
    <style>
        html, body, body > div, #container, #container-uiarea {
            height: 100%;
        }
    </style>
    <script>
        // Tryb jasny / ciemny zapamiętany w przeglądarce (ext/ThemeSwitch.js) - ustawiany przed startem UI5
        (function () {
            var dark = false;
            try {
                dark = window.localStorage.getItem("zwb.rcz.theme") === "dark";
            } catch (error) {
                dark = false;
            }
            window["sap-ui-config"] = { theme: dark ? "sap_horizon_dark" : "sap_horizon" };
            if (dark) {
                document.documentElement.className += " zwbRczDark";
            }
        }());
    </script>
    <script
        id="sap-ui-bootstrap"
        src="/sap/public/bc/ui5_ui5/resources/sap-ui-core.js"
        data-sap-ui-language="pl"
        data-sap-ui-resourceroots='{ "zwb.rcz": "./" }'
        data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-async="true"
        data-sap-ui-frameOptions="trusted"
    ></script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
    <div
        data-sap-ui-component
        data-name="zwb.rcz"
        data-id="container"
        data-settings='{"id" : "zwbrcz"}'
        data-handle-validation="true"
    ></div>
</body>
</html>
